<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

<!-- App Header / Navigation -->
<header class="app-header">
    <h1>Student Portal</h1>
    <button id="btn-logout" class="btn-logout" style="display: none;">Logout</button>
</header>

<div class="container">

    <!-- 1. Login View (Shown when not authenticated) -->
    <section id="login-section" class="card">
        <h2>Student Login</h2>
        <div id="login-error" class="error-message" style="display: none; color: #d9534f; margin-bottom: 12px; font-weight: bold;"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="login-student-id">Student ID or Email</label>
                <input type="text" id="login-student-id" placeholder="e.g. 2026-0001" required>
            </div>

            <div class="form-group" style="margin-top: 10px;">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Enter password" required>
            </div>

            <button type="submit" id="btn-login" style="margin-top: 15px; width: 100%;">Login</button>
        </form>
    </section>

    <!-- Feedback Alert Box -->
    <div id="alert-message" class="alert-message" style="display: none; padding: 10px; margin-bottom: 15px; border-radius: 4px; text-align: center; font-weight: bold;"></div>

    <!-- 2. Protected Student Profile View (Hidden until authenticated) -->
    <main id="profile-section" style="display: none;">

        <!-- Profile Overview Card -->
        <section class="card profile-card">
            <div class="profile-header">
                <div class="avatar-container">
                    <img id="profile-pic" src="img/default-avatar.png" alt="Profile Picture" class="avatar">
                    <button id="btn-change-photo" class="btn-secondary">Change Photo</button>
                </div>
                <div class="profile-main-info">
                    <h2 id="display-name">Dwayne Delos Santos</h2>
                    <p id="display-course-year" class="subtitle">BS Information Technology - 3rd Year</p>
                    <p id="display-student-id" class="student-id-tag">ID: 2026-0001</p>
                </div>
            </div>
            <button id="btn-edit-profile" class="btn-primary">Edit Profile</button>
        </section>

        <!-- Edit Profile Form (Hidden by default) -->
        <section id="edit-view" class="card" style="display: none;">
            <h3>Edit Profile</h3>
            <form id="profile-form">
                <div class="form-group">
                    <label for="input-name">Full Name:</label>
                    <input type="text" id="input-name" required>
                </div>

                <div class="form-group">
                    <label for="input-course">Course:</label>
                    <input type="text" id="input-course" required>
                </div>

                <div class="form-group">
                    <label for="input-year">Year Level:</label>
                    <input type="text" id="input-year" required>
                </div>

                <div class="form-group">
                    <label for="input-about">About Me:</label>
                    <textarea id="input-about" rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label for="input-skills">Skills (comma-separated):</label>
                    <input type="text" id="input-skills">
                </div>

                <div class="form-actions" style="margin-top: 15px;">
                    <button id="btn-save" type="button" class="btn-success">Save</button>
                    <button id="btn-cancel" type="button" class="btn-secondary">Cancel</button>
                </div>
            </form>
        </section>

        <!-- Details Section -->
        <section class="card">
            <h3>About Me</h3>
            <p id="display-about">IT student passionate about web and mobile app development.</p>

            <h3 style="margin-top: 15px;">Skills</h3>
            <ul id="display-skills-list" class="skills-list"></ul>
        </section>

    </main>
</div>

<script src="cordova.js"></script>
<script src="js/index.js"></script>
</body>
</html>
